server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
spring:
  application:
    name: ms-talleres360-audit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
app:
  internal-key: ${INTERNAL_API_KEY:}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:auditdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
