name: talleres360-kafka
x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.9.6
  restart: unless-stopped
  mem_limit: 384m
  environment: &zk-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 10
    ZOOKEEPER_SYNC_LIMIT: 5
    ZOOKEEPER_SERVERS: "zoo1:2888:3888;zoo2:2888:3888;zoo3:2888:3888"
    KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"
    ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
    ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
  healthcheck:
    test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/2181'"]
    interval: 10s
    timeout: 5s
    retries: 30
  logging: &logs
    driver: json-file
    options: {max-size: 10m, max-file: "2"}
x-kafka: &kafka
  image: confluentinc/cp-kafka:7.9.6
  restart: unless-stopped
  mem_limit: 1024m
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: zoo1:2181,zoo2:2181,zoo3:2181
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DELETE_TOPIC_ENABLE: "true"
    KAFKA_LOG_RETENTION_HOURS: 168
    KAFKA_LOG_RETENTION_BYTES: 33554432
    KAFKA_LOG_SEGMENT_BYTES: 8388608
    KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    KAFKA_LOG4J_LOGGERS: "kafka=WARN,org.apache.zookeeper=WARN"
  depends_on:
    zoo1: {condition: service_healthy}
    zoo2: {condition: service_healthy}
    zoo3: {condition: service_healthy}
  healthcheck:
    test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 20s
    timeout: 15s
    retries: 30
    start_period: 30s
  logging: *logs
services:
  zoo1:
    <<: *zookeeper
    hostname: zoo1
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 1
    volumes: ["datos_zoo1:/var/lib/zookeeper/data", "logs_zoo1:/var/lib/zookeeper/log"]
  zoo2:
    <<: *zookeeper
    hostname: zoo2
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    volumes: ["datos_zoo2:/var/lib/zookeeper/data", "logs_zoo2:/var/lib/zookeeper/log"]
  zoo3:
    <<: *zookeeper
    hostname: zoo3
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    volumes: ["datos_zoo3:/var/lib/zookeeper/data", "logs_zoo3:/var/lib/zookeeper/log"]
  kafka1:
    <<: *kafka
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_PRIVATE_IP:?Configura la IP privada}:9092
    ports: ["9092:9092"]
    volumes: ["datos_kafka1:/var/lib/kafka/data"]
  kafka2:
    <<: *kafka
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_PRIVATE_IP:?Configura la IP privada}:9093
    ports: ["9093:9092"]
    volumes: ["datos_kafka2:/var/lib/kafka/data"]
  kafka3:
    <<: *kafka
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_PRIVATE_IP:?Configura la IP privada}:9094
    ports: ["9094:9092"]
    volumes: ["datos_kafka3:/var/lib/kafka/data"]
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    restart: unless-stopped
    mem_limit: 512m
    ports: ["127.0.0.1:8088:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: talleres360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    logging: *logs
  administrador:
    build: ./administrador
    image: talleres360/administrador-kafka:local
    restart: unless-stopped
    mem_limit: 384m
    ports: ["8087:8087"]
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Configura INTERNAL_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    logging: *logs
volumes:
  datos_zoo1:
  logs_zoo1:
  datos_kafka1:
  datos_zoo2:
  logs_zoo2:
  datos_kafka2:
  datos_zoo3:
  logs_zoo3:
  datos_kafka3:
